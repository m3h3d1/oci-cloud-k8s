            - UCsBjURrPoezykLs9EqgamOA # Fireship
            - UCbfYPyITQ-7l4upoX8nvctg # Two Minute Papers
            - UCzCsyvyrq38R6TnztEzOmgg # ByteMonk
            - UCYO_jab_esuFRV4b17AJtAw # 3Blue1Brown
            - UCGKEMK3s-ZPbjVOIuAV8clQ # Core Dumped
            - UCqpacJgWdTXok-E8j7TCTPg # Visual AI
            - UC5--wS0Ljbin1TjWQX6eafA # bigboxSWE
            - UC6biysICWOJ-C3P4Tyeggzg # Low Level
            - UCgfe2ooZD3VJPB6aJAnuQng # bycloud

    - size: small
      widgets:
        - type: group
          title: Dhaka
          widgets:
            - type: weather
              title: Weather
              location: Dhaka, Bangladesh
              units: metric # alternatively "imperial"
              hour-format: 12h # alternatively "24h"
              # Optionally hide the location from being displayed in the widget
              # hide-location: true

            - type: custom-api
              title: Air Quality
              cache: 10m
              url: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=23.8103&longitude=90.4125&current=us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide&timezone=Asia%2FDhaka"
              template: |
                {{ if eq .Response.StatusCode 200 }}
                  {{ $aqi := .JSON.Int "current.us_aqi" }}
                  <div class="size-h5">
                    {{ if le $aqi 50 }}
                      <div class="color-positive">Good air quality</div>
                    {{ else if le $aqi 100 }}
                      <div class="color-primary">Moderate air quality</div>
                    {{ else if le $aqi 150 }}
                      <div class="color-negative">Unhealthy for sensitive groups</div>
                    {{ else if le $aqi 200 }}
                      <div class="color-negative">Unhealthy air quality</div>
                    {{ else }}
                      <div class="color-negative">Very unhealthy air quality</div>
                    {{ end }}
                  </div>

                  <div class="color-highlight size-h2">AQI: {{ $aqi }}</div>
                  <div style="border-bottom: 1px solid; margin-block: 10px;"></div>

                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                      <div class="size-h3 color-highlight">{{ .JSON.Float "current.pm2_5" | printf "%.1f" }} ug/m3</div>
                      <div class="size-h6">PM2.5</div>
                    </div>
                    <div>
                      <div class="size-h3 color-highlight">{{ .JSON.Float "current.pm10" | printf "%.1f" }} ug/m3</div>
                      <div class="size-h6">PM10</div>
                    </div>
                    <div>
                      <div class="size-h3 color-highlight">{{ .JSON.Float "current.ozone" | printf "%.1f" }} ug/m3</div>
                      <div class="size-h6">OZONE</div>
                    </div>
                    <div>
                      <div class="size-h3 color-highlight">{{ .JSON.Float "current.nitrogen_dioxide" | printf "%.1f" }} ug/m3</div>
                      <div class="size-h6">NO2</div>
                    </div>
                  </div>

                  <div class="size-h6" style="margin-top: 10px;">Updated {{ slice (.JSON.String "current.time") 11 16 }}</div>
                  <a class="size-h6" href="https://open-meteo.com/en/docs/air-quality-api" target="_blank" rel="noreferrer">Data: Open-Meteo / CAMS</a>
                {{ else }}
                  <div class="color-negative">Air quality data unavailable</div>
                {{ end }}

        - type: custom-api
          title: LeetCode Daily Question
          cache: 6h
          url: https://leetcode.com/graphql
          method: POST
          headers:
            Accept: application/json
          body-type: json
          body:
            query: |
              query questionOfToday {
                activeDailyCodingChallengeQuestion {
                  link
                  question {
                    questionId
                    title
                    difficulty
                    topicTags {
                      name
                      slug
                    }
                  }
                }
              }
            operationName: questionOfToday
          template: |
            <div class="leetcode-card">
              <style>
                .leetcode-card {
                  max-width: 600px;
                  margin: 8px auto;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                  transition: transform 0.2s ease, box-shadow 0.2s ease;
                }
                .leetcode-card h1 {
                  font-size: 24px;
                  margin: 0 0 16px;
                  line-height: 1.3;
                }
                .leetcode-card h1 a {
                  color: #8CAAEE;
                  text-decoration: none;
                  transition: color 0.2s ease;
                }
                .leetcode-card h1 a:hover {
                  color: #BAC8FF;
                  text-decoration: underline;
                }
                .leetcode-card p {
                  margin: 8px 0;
                  color: #C6D0F5;
                  font-size: 16px;
                }
                .leetcode-card .difficulty {
                  font-weight: 600;
                  color: #A5ADCE;
                }
                .leetcode-card .difficulty.Easy {
                  color: #A6D189;
                }
                .leetcode-card .difficulty.Medium {
                  color: #E5C890;
                }
                .leetcode-card .difficulty.Hard {
                  color: #E78284;
                }
                .leetcode-card .topics {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                  margin: 12px 0;
                }
                .leetcode-card .topic-tag {
                  background: #CA9EE6;
                  color: #303446;
                  padding: 4px 12px;
                  border-radius: 16px;
                  font-size: 14px;
                  font-weight: 500;
                  transition: transform 0.2s ease;
                }
                .leetcode-card .topic-tag:hover {
                  transform: scale(1.05);
                }
                .leetcode-card .premium {
                  color: #E78284;
                  font-weight: 600;
                  margin-top: 12px;
                }
                @media (max-width: 600px) {
                  .leetcode-card {
                    padding: 16px;
                    margin: 8px;
                  }
                  .leetcode-card h1 {
                    font-size: 20px;
                  }
                  .leetcode-card p {
                    font-size: 14px;
                  }
                  .leetcode-card .topic-tag {
                    font-size: 12px;
                    padding: 3px 10px;
                  }
                }
              </style>
              <h1>
                <a href="https://leetcode.com{{ .JSON.String "data.activeDailyCodingChallengeQuestion.link" }}" target="_blank">
                  {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.questionId" }} - {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.title" }}
                </a>
              </h1>
              <p class="difficulty {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}"><strong>Difficulty:</strong> {{ .JSON.String "data.activeDailyCodingChallengeQuestion.question.difficulty" }}</p>
              <p><strong>Topics:</strong></p>
              <div class="topics">
                {{ if .JSON.Exists "data.activeDailyCodingChallengeQuestion.question.topicTags" }}
                  {{ range .JSON.Array "data.activeDailyCodingChallengeQuestion.question.topicTags" }}
                    <span class="topic-tag">{{ .String "name" }}</span>
                  {{ end }}
                {{ else }}
                  <span class="topic-tag">None</span>
                {{ end }}
              </div>
              {{ if .JSON.Bool "data.activeDailyCodingChallengeQuestion.question.paidOnly" }}
                <p class="premium">This is a Premium question</p>
              {{ end }}
            </div>

        - type: group
          title: GitHub
          widgets:
            - type: custom-api
              title: Trending Repositories
              cache: 24h
              url: https://api.ossinsight.io/v1/trends/repos/?period=${PERIOD}&language=${LANGUAGE}
              template: |
                <ul class="list list-gap-10 collapsible-container" data-collapse-after="5">
                  {{ range .JSON.Array "data.rows" }}
                    <li>
                      <a class="color-primary-if-not-visited" href="https://github.com/{{ .String "repo_name" }}" target="_blank" rel="noreferrer">{{ .String "repo_name" }}</a>
                      <ul class="list-horizontal-text">
                        <li class="color-highlight">{{ .String "primary_language" }}</li>
                        <li>{{ .Int "stars" }} stars</li>
                        <li>{{ .Int "forks" }} forks</li>
                        <li>{{ .Int "pull_requests" }} PRs</li>
                      </ul>
                    </li>
                  {{ end }}
                </ul>

            - type: releases
              title: Releases
              cache: 1d
              # Without authentication the Github API allows for up to 60 requests per hour. You can create a
              # read-only token from your Github account settings and use it here to increase the limit.
              # token: ...
              repositories:
                - spicetify/cli
                - crimera/piko
                - glanceapp/glance
                - go-gitea/gitea
                - immich-app/immich
                - syncthing/syncthing


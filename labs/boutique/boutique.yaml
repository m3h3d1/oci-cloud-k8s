apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: boutique
  namespace: boutique
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
  hostnames:
    - boutique.nirjon.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80

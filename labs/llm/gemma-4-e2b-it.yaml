# Temporary, private CPU inference test for Gemma 4 E2B IT.
# Apply manually with: kubectl apply -f labs/llm/gemma-4-e2b-it.yaml
# Remove completely with: kubectl delete -f labs/llm/gemma-4-e2b-it.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-gemma-4-e2b-it
  namespace: lab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-4-e2b-it
  namespace: lab
spec:
  # Keep the Gemma model volume intact while MiniCPM is the active CPU test.
  replicas: 0
  # The node cannot accommodate two 5Gi benchmark Pods during a rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gemma-4-e2b-it
  template:
    metadata:
      labels:
        app: gemma-4-e2b-it
    spec:
      # Node .22 is the low-memory-use node following the OKE rotation.
      # This is intentionally a short-lived benchmark placement, not a
      # permanent scheduling policy.
      nodeSelector:
        kubernetes.io/hostname: 10.0.1.22
      initContainers:
        - name: download-model
          image: docker.io/curlimages/curl:8.16.0
          securityContext:
            # A newly mounted Longhorn volume is root-owned; curl's image
            # defaults to an unprivileged UID and otherwise cannot save it.
            runAsUser: 0
          command:
            - sh
            - -ec
            - |
              model=/models/gemma-4-E2B_q4_0-it.gguf
              test -s "$model" || {
                rm -f /models/google_gemma-4-E2B-it-Q4_K_M.gguf
                curl --fail --location --retry 3 \
                  --output "$model" \
                  https://huggingface.co/google/gemma-4-E2B-it-qat-q4_0-gguf/resolve/main/gemma-4-E2B_q4_0-it.gguf
              }
              mmproj=/models/gemma-4-E2B-it-mmproj.gguf
              test -s "$mmproj" || curl --fail --location --retry 3 \
                --output "$mmproj" \
                https://huggingface.co/google/gemma-4-E2B-it-qat-q4_0-gguf/resolve/main/gemma-4-E2B-it-mmproj.gguf
              draft=/models/mtp-gemma-4-E2B-it.gguf
              test -s "$draft" || curl --fail --location --retry 3 \
                --output "$draft" \
                https://huggingface.co/unsloth/gemma-4-E2B-it-qat-GGUF/resolve/main/mtp-gemma-4-E2B-it.gguf
          volumeMounts:
            - name: model-storage
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/gemma-4-E2B_q4_0-it.gguf
            - --mmproj
            - /models/gemma-4-E2B-it-mmproj.gguf
            - --model-draft
            - /models/mtp-gemma-4-E2B-it.gguf
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "4"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - --parallel
            - "1"
            - --threads
            - "2"
            - --threads-batch
            - "2"
            - --prio
            - "2"
            - --reasoning
            - "on"
            - --reasoning-format
            - deepseek
          ports:
            - containerPort: 8080
          resources:
            requests:
              # The 2-OCPU worker reserves roughly 430m for OKE workloads.
              # Request what can be scheduled; permit two threads when idle.
              cpu: 1300m
              memory: 5Gi
            limits:
              cpu: "2"
              memory: 6Gi
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: models-gemma-4-e2b-it
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-4-e2b-it
  namespace: lab
spec:
  selector:
    app: gemma-4-e2b-it
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gemma-llm
  namespace: lab
spec:
  hostnames:
    - gemma-llm.nirjon.xyz
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy-gateway
  rules:
    - backendRefs:
        - name: gemma-4-e2b-it
          port: 8080
      timeouts:
        request: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gemma-llm-oidc
  namespace: lab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gemma-llm
  oidc:
    provider:
      issuer: https://login.nirjon.xyz/dex/
    clientID: envoy-gateway
    clientSecret:
      name: dex-envoy-client
    redirectURL: https://gemma-llm.nirjon.xyz/oauth2/callback
    logoutPath: /logout
    refreshToken: true

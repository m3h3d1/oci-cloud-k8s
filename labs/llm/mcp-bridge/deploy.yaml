apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-bridge-token
  namespace: lab
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: mcp-bridge-token
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: token
      remoteRef:
        key: mcp-bridge-token
        version: CURRENT
        decodingStrategy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-bridge
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-bridge
  template:
    metadata:
      labels:
        app: mcp-bridge
    spec:
      containers:
      - name: mcp-bridge
        image: docker.io/node:22-alpine
        command: ["node", "/app/server.js"]
        env:
        - name: TAVILY_API_KEY
          valueFrom:
            secretKeyRef:
              name: tavily-api-key
              key: api-key
        - name: BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-bridge-token
              key: token
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: script
          mountPath: /app
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: script
        configMap:
          name: mcp-bridge-script
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-bridge
  namespace: lab
spec:
  selector:
    app: mcp-bridge
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-bridge
  namespace: lab
spec:
  hostnames:
  - mcp-bridge.nirjon.xyz
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy
    namespace: envoy-gateway
  rules:
  - backendRefs:
    - name: mcp-bridge
      port: 8080

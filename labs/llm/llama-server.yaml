apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: llama-server
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  serviceName: llama-server
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: llama-server
            topologyKey: kubernetes.io/hostname
      initContainers:
      # Injects the bridge token into ui.json. Heredoc is quoted so the JSON's
      # backslash escapes survive the shell. Note "headers" must itself be a
      # JSON *string* — the WebUI JSON.parse()s it, and drops non-string values.
      - name: render-ui-config
        image: ghcr.io/ggml-org/llama.cpp:server
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          cat > /tmp/ui.tmpl <<'TMPL'
          {"mcpServers": "[{\"name\": \"tavily\", \"url\": \"https://mcp-bridge.nirjon.xyz/mcp\", \"transport\": \"streamable_http\", \"enabled\": true, \"headers\": \"{\\\"Authorization\\\": \\\"Bearer __BRIDGE_TOKEN__\\\"}\"}]"}
          TMPL
          sed "s|__BRIDGE_TOKEN__|${BRIDGE_TOKEN}|" /tmp/ui.tmpl > /uiconfig/ui.json
        env:
        - name: BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-bridge-token
              key: token
        volumeMounts:
        - name: uiconfig
          mountPath: /uiconfig
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
        - -m
        - /models/qwen3.5-2b-q4_0.gguf
        - --host
        - "0.0.0.0"
        - --port
        - "8080"
        - --ctx-size
        - "8192"
        - --parallel
        - "1"
        - --n-gpu-layers
        - "0"
        - -t
        - "2"
        - --threads-batch
        - "2"
        # Seeds the WebUI's MCP config server-side. The browser wipes its own
        # copy whenever /props returns non-JSON, which happens on every logout.
        - --ui-config-file
        - /uiconfig/ui.json
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2048Mi
        volumeMounts:
        - name: models
          mountPath: /models
        - name: uiconfig
          mountPath: /uiconfig
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: uiconfig
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: models
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: lab
spec:
  selector:
    app: llama-server
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm
  namespace: lab
spec:
  hostnames:
  - llm.nirjon.xyz
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy
    namespace: envoy-gateway
  rules:
  - backendRefs:
    - name: llama-server
      port: 8080
    timeouts:
      request: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: llm-oidc
  namespace: lab
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: llm
  oidc:
    provider:
      issuer: https://login.nirjon.xyz/dex/
    clientID: envoy-gateway
    clientSecret:
      name: dex-envoy-client
    redirectURL: https://llm.nirjon.xyz/oauth2/callback
    logoutPath: /logout
    refreshToken: true

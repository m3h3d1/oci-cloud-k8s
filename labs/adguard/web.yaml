apiVersion: v1
kind: Service
metadata:
  name: adguard-web
  namespace: lab
spec:
  selector:
    app: adguard
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
  namespace: lab
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
      namespace: envoy-gateway
  hostnames:
    - adguard.nirjon.xyz
  rules:
    - backendRefs:
        - name: adguard-web
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: adguard-oidc
  namespace: lab
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: adguard
  oidc:
    provider:
      issuer: https://login.nirjon.xyz/dex/
    clientID: envoy-gateway
    clientSecret:
      name: dex-envoy-client
    redirectURL: https://adguard.nirjon.xyz/oauth2/callback
    logoutPath: /logout
    refreshToken: true

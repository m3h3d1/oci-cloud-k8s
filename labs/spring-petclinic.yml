apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      # Use your secret if you still hit Docker Hub rate limits
      # imagePullSecrets:
      # - name: dockerhub-config
      containers:
      - name: petclinic
        image: ajaysaraf403/spring-petclinic
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: hsqldb
        resources:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: lab
spec:
  selector:
    app: petclinic
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petclinic
  namespace: lab
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
  hostnames:
    - petclinic.nirjon.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: petclinic
          port: 80

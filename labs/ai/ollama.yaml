apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        kubernetes.io/hostname: 10.0.1.84
      containers:
      - name: ollama
        image: docker.io/ollama/ollama:latest
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: "1"
            memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: lab
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434

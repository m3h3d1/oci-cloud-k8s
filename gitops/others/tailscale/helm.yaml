apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 5m
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: tailscale
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: tailscale-operator
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 5m
  releaseName: tailscale-operator
  values:
    operatorConfig:
      image:
        repository: docker.io/tailscale/k8s-operator
  valuesFrom:
    - kind: Secret
      name: tailscale-operator-values
      valuesKey: values.yaml

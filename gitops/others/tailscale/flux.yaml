apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-install
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/others/tailscale
  prune: true
  dependsOn:
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: operator
      namespace: tailscale
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-resources
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/others/tailscale/resources
  prune: true
  dependsOn:
    - name: tailscale-install
  sourceRef:
    kind: GitRepository
    name: flux-system

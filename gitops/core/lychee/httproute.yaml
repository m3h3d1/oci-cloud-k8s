apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lychee
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
  hostnames:
    - "img.nirjon.xyz"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: lychee-service
          port: 80
